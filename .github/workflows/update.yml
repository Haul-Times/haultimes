name: Update HaulTimes

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["scripts/**", "static/**", "images/**", "config.json", "overrides.json", "social.json"]

permissions:
  contents: write

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Border wait times
        run: python scripts/fetch_border.py
        continue-on-error: true

      - name: News
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/fetch_news.py
        continue-on-error: true

      - name: Build pages
        run: python scripts/build_site.py

      # Facebook / X posting. Off or dry-run unless social.json says "live".
      # Credentials live only in GitHub Secrets.
      - name: Social posts
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python scripts/social.py
        continue-on-error: true

      - name: Save changes
        run: |
          git config user.name "HaulTimes"
          git config user.email "updates@haultimes.com"
          git add -A data site
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update news and border waits" --quiet
            git pull --rebase --quiet || true
            git push --quiet
          fi
